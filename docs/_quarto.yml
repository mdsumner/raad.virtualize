project:
  type: website
  output-dir: _site
  pre-render: python3 ../py/site_published.py
  render:
    - "*.qmd"
    - "*.md"
    - "examples/**/*.qmd"
  resources:
    - "handover/index.html"
    - "handover/snapshot.html"

website:
  title: "raad.virtualize"
  description: "One store of byte references per array collection; kerchunk, Icechunk and GDAL multidim VRT rendered from it"
  site-url: https://mdsumner.github.io/raad.virtualize/
  repo-url: https://github.com/mdsumner/raad.virtualize
  repo-subdir: docs
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: published.md
        text: Datasets
      - href: how-it-works.md
        text: How it works
      - href: readers.qmd
        text: Readers
      - href: related.md
        text: Related
      - text: Working notes
        menu:
          - href: notes.md
          - href: results.md
          - href: reading-published-stores.md
          - href: examples/index.qmd
          - href: indexes-only-product.md
          - href: ghrsst-source-coop.md
          - href: esacci-oc.md
          - href: bedmap-source-coop.md
    right:
      - icon: github
        href: https://github.com/mdsumner/raad.virtualize
  page-footer:
    left: "AAD virtual stores on source.coop. Status 2026-11-05."
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    code-overflow: wrap
    css: styles.css
