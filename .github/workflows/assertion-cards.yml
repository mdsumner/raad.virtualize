name: assertion-cards

# The done test of the assertion step (requests/assertion-step.md): for each
# dataset, the published store.sqlite and plan.vrt are fetched (from the
# scratch product, or from `base` for a dataset published in its own
# product), the assert,
# render, icechunk and stac steps run from them (no harvest, no source
# reads), and py/assertion_cards.py compares every projection with the
# dataset's assertions. The report is the job summary and an artifact
# (cards-<dataset>), to be committed as requests/assertion-step/cards/.
# Nothing is published.

on:
  pull_request:
    paths:
      - "assertions/**"
      - "py/assertions.py"
      - "py/assertion_cards.py"
      - "py/render_icechunk.py"
      - "R/mdimrefs.R"
      - "R/mdimrefs_pipeline.R"
      - "R/stac.R"
      - "run.sh"
      - ".github/workflows/assertion-cards.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assertion-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: ghcr.io/hypertidy/gdal-r-python-extras:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: g02202-v6-daily-south
            group: seaice
            config: config/seaice-g02202.sh
            env: SEAICE_HEM=south
          - dataset: g02202-v6-daily-north
            group: seaice
            config: config/seaice-g02202.sh
            env: SEAICE_HEM=north
          - dataset: asi-amsr2-v5.4-daily-south
            group: seaice
            config: config/seaice-asi-amsr2.sh
            env: SEAICE_HEM=south
          - dataset: oisst-v2.1-daily
            group: oisst
            config: config/oisst.sh
            env: ""
          - dataset: ghrsst-mur-cog-analysed_sst
            group: ghrsst
            config: config/ghrsst-cog.sh
            env: GHRSST_VAR=analysed_sst
          - dataset: bluelink-daily-temp
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=temp
          - dataset: bluelink-daily-salt
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=salt
          - dataset: bluelink-daily-eta_t
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=eta_t
          - dataset: bluelink-daily-mld
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=mld
          - dataset: bluelink-daily-u
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=u
          - dataset: bluelink-daily-v
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=v
          - dataset: bluelink-daily-w
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=w
          - dataset: bluelink-daily-tx_trans_int_z
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=tx_trans_int_z
          - dataset: bluelink-daily-ty_trans_int_z
            group: bluelink
            config: config/bluelink.sh
            env: BLUELINK_FREQ=daily BRAN_VAR=ty_trans_int_z
          - dataset: bedmap3
            group: bedmap
            config: config/bedmap3.sh
            env: ""
            base: https://data.source.coop/ausantarctic/bedmap/virtual/bedmap3
          - dataset: bedmachine-v4.1
            group: bedmachine
            config: config/bedmachine.sh
            env: ""
            base: https://data.source.coop/ausantarctic/bedmachine/virtual/bedmachine-v4.1
          - dataset: ibcso-v2
            group: ibcso
            config: config/ibcso.sh
            env: IBCSO_RELEASE=v2
            base: https://data.source.coop/ausantarctic/ibcso/virtual/ibcso-v2
          - dataset: ibcso-annual-2024
            group: ibcso
            config: config/ibcso.sh
            env: IBCSO_RELEASE=2024
            base: https://data.source.coop/ausantarctic/ibcso/virtual/ibcso-annual-2024
          - dataset: ibcso-annual-2025
            group: ibcso
            config: config/ibcso.sh
            env: IBCSO_RELEASE=2025
            base: https://data.source.coop/ausantarctic/ibcso/virtual/ibcso-annual-2025
          - dataset: gebco-2024
            group: gebco
            config: config/gebco.sh
            env: GEBCO_YEAR=2024
            base: https://data.source.coop/ausantarctic/gebco/virtual/gebco-2024
          - dataset: gebco-2025
            group: gebco
            config: config/gebco.sh
            env: GEBCO_YEAR=2025
            base: https://data.source.coop/ausantarctic/gebco/virtual/gebco-2025
          - dataset: gebco-2026
            group: gebco
            config: config/gebco.sh
            env: GEBCO_YEAR=2026
            base: https://data.source.coop/ausantarctic/gebco/virtual/gebco-2026
          - dataset: esacci-oc-v6.0-monthly-chlor_a
            group: oceancolour
            config: config/esacci-oc.sh
            env: ESACCI_CADENCE=monthly ESACCI_VAR=chlor_a
          - dataset: esacci-oc-v6.0-monthly-chlor_a_log10_bias
            group: oceancolour
            config: config/esacci-oc.sh
            env: ESACCI_CADENCE=monthly ESACCI_VAR=chlor_a_log10_bias
          - dataset: esacci-oc-v6.0-monthly-chlor_a_log10_rmsd
            group: oceancolour
            config: config/esacci-oc.sh
            env: ESACCI_CADENCE=monthly ESACCI_VAR=chlor_a_log10_rmsd
          - dataset: esacci-oc-v6.0-5day-chlor_a
            group: oceancolour
            config: config/esacci-oc.sh
            env: ESACCI_CADENCE=5day ESACCI_VAR=chlor_a
          - dataset: esacci-oc-v6.0-5day-chlor_a_log10_bias
            group: oceancolour
            config: config/esacci-oc.sh
            env: ESACCI_CADENCE=5day ESACCI_VAR=chlor_a_log10_bias
          - dataset: esacci-oc-v6.0-5day-chlor_a_log10_rmsd
            group: oceancolour
            config: config/esacci-oc.sh
            env: ESACCI_CADENCE=5day ESACCI_VAR=chlor_a_log10_rmsd
    env:
      SCRATCH: https://data.source.coop/ausantarctic/ausantarctic-scratch
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          python -m pip install --quiet "storecard[virtual] @ git+https://github.com/hypertidy/storecard" ||
            python -m pip install --quiet --break-system-packages "storecard[virtual] @ git+https://github.com/hypertidy/storecard"
          git clone --depth 1 https://github.com/hypertidy/storecard /tmp/storecard
      - name: Published store and plan
        run: |
          W=work/${{ matrix.dataset }}; mkdir -p "$W"
          B="${{ matrix.base }}"; B=${B:-$SCRATCH/${{ matrix.group }}/${{ matrix.dataset }}}
          curl -fsSL -o "$W/store.sqlite" "$B/store.sqlite"
          curl -fsSL -o "$W/plan.vrt" "$B/plan.vrt"
          ls -la "$W"
      - name: Assert and render
        run: |
          export ${{ matrix.env }}
          export E2E_WORK=$PWD/work/${{ matrix.dataset }} STAC_THUMBNAIL=0 STAC_GEOPARQUET=0
          bash run.sh ${{ matrix.config }} assert render icechunk stac
      - name: Cards
        run: |
          W=work/${{ matrix.dataset }}
          B="${{ matrix.base }}"; B=${B:-$SCRATCH/${{ matrix.group }}/${{ matrix.dataset }}}
          mkdir -p cards
          python py/assertion_cards.py --out "$W/out" --assertions assertions/${{ matrix.dataset }} \
            --before "$B" \
            --overlay /tmp/storecard/assertions/ausantarctic/${{ matrix.dataset }} \
            --md cards/${{ matrix.dataset }}.md --json cards/${{ matrix.dataset }}.json || status=$?
          cat cards/${{ matrix.dataset }}.md >> "$GITHUB_STEP_SUMMARY"
          cat cards/${{ matrix.dataset }}.md
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards-${{ matrix.dataset }}
          path: |
            cards/
            work/${{ matrix.dataset }}/log.txt
            work/${{ matrix.dataset }}/out/flat/arrays.json
            work/${{ matrix.dataset }}/out/stac/collection.json
